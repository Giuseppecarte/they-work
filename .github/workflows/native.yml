name: Native builds

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust and target
        shell: bash
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component clippy --component rustfmt
          rustup target add --toolchain 1.90.0 ${{ matrix.target }}
      - name: Install static Linux C toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Check native portability
        run: cargo clippy --locked --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Run native tests
        run: cargo test --locked --workspace --target ${{ matrix.target }} -- --test-threads=1
      - name: Build release binary
        run: cargo build --locked --release --bin they-work --target ${{ matrix.target }}
      - name: Test native installer failure boundaries
        if: runner.os != 'Windows'
        run: python3 scripts/test-native-install.py
      - name: Test Windows installer failure boundaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-native-install.ps1
      - name: Package and smoke-test native executable
        run: python scripts/package-release.py --target ${{ matrix.target }}
      - name: Upload native distribution
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: target/dist/*
          if-no-files-found: error
