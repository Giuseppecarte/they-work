name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  native:
    uses: ./.github/workflows/native.yml

  image:
    name: Verify container candidate
    runs-on: ubuntu-latest
    needs: native
    permissions:
      contents: read
      packages: write
    outputs:
      verification_artifact: ${{ steps.names.outputs.verification_artifact }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Test promotion and verification boundaries
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-release-image.py

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name this isolated candidate
        id: names
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "repository=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "verification_artifact=candidate-verification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Calculate source labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.repository }}

      - name: Build and push only the candidate
        id: candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.names.outputs.repository }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify both platforms and normal interactive exit
        env:
          CANDIDATE: ${{ steps.names.outputs.repository }}@${{ steps.candidate.outputs.digest }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          python3 scripts/test-published-image.py --image "$CANDIDATE"
          --commit "$SOURCE_COMMIT" --source-state clean --report target/release-evidence/verification.json

      - name: Retain candidate verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.verification_artifact }}
          path: target/release-evidence/verification.json
          if-no-files-found: error
          retention-days: 90

  release:
    name: Promote verified images and publish native assets
    runs-on: ubuntu-latest
    needs: [native, image]
    # Every version shares latest. A tag-specific group would not serialize it.
    concurrency:
      group: release-publication
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: target/dist
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.image.outputs.verification_artifact }}
          path: target/release-evidence
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check all native checksums and prepare immutable intent
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 scripts/release_image.py prepare --verification target/release-evidence/verification.json --native-dir target/dist --version "$RELEASE_TAG" --commit "$SOURCE_COMMIT" --out target/release-evidence/intent.json
          cp scripts/install.sh scripts/install.ps1 target/dist/

      # Upload must succeed BEFORE the first public-tag write. Do not overwrite
      # an earlier attempt's intent; recover with its original verified digest.
      - name: Retain intent before public promotion
        uses: actions/upload-artifact@v4
        with:
          name: release-intent-${{ github.run_id }}
          path: |
            target/release-evidence/intent.json
            target/release-evidence/verification.json
          if-no-files-found: error
          retention-days: 90

      - name: Promote exact index, version then latest
        run: >-
          python3 scripts/release_image.py promote --intent target/release-evidence/intent.json
          --verification target/release-evidence/verification.json --native-dir target/dist
          --record target/release-evidence/promotion.json

      - name: Publish verified native assets
        id: native_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd target/dist
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes ./*.tar.gz ./*.zip SHA256SUMS install.sh install.ps1

      - name: Record native publication outcome
        if: always()
        env:
          NATIVE_OUTCOME: ${{ steps.native_release.outcome }}
        run: >-
          python3 scripts/release_image.py outcome --record target/release-evidence/promotion.json
          --native-release "${NATIVE_OUTCOME:-skipped}"

      - name: Retain partial or complete publication record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/release-evidence/
          if-no-files-found: warn
          retention-days: 90
