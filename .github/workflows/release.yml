name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  native:
    uses: ./.github/workflows/native.yml

  image:
    name: Publish container image
    runs-on: ubuntu-latest
    needs: native
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Enable both Linux image architectures
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and publish the release image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify the published image through a capable PTY
        run: >-
          python3 scripts/test-published-image.py
          --image ghcr.io/${{ github.repository }}@${{ steps.publish.outputs.digest }}

  release:
    name: Publish verified native assets
    runs-on: ubuntu-latest
    needs: [native, image]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: target/dist
      - name: Verify distribution and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd target/dist
          cat ./*.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS
          cp ../../scripts/install.sh ../../scripts/install.ps1 .
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes ./*.tar.gz ./*.zip SHA256SUMS install.sh install.ps1
