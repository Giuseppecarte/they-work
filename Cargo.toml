[workspace]
resolver = "2"
members = [
    "crates/theywork-core",
    "crates/theywork-collect",
    "crates/theywork-render",
    "crates/theywork-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/OWNER/they-work"
description = "A pixel-art virtual office for watching your AI coding agents work."

[workspace.dependencies]
theywork-core = { path = "crates/theywork-core" }
theywork-collect = { path = "crates/theywork-collect" }
theywork-render = { path = "crates/theywork-render" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"
crossterm = "0.28"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = 3
lto = true
strip = true
