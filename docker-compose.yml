# they-work runs with no network and read-only mounts. It can look at your
# agents' transcripts and do nothing else.
services:
  they-work:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: they-work:local
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stdin_open: true
    tty: true
    environment:
      TERM: ${TERM:-xterm-256color}
      COLORTERM: ${COLORTERM:-truecolor}
    volumes:
      - ${HOME}/.claude:/data/claude:ro
      - ${HOME}/.codex:/data/codex:ro
