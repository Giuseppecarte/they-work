<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">they-work demo office floor</title>
  <desc id="desc">A pixel-art terminal showing the checkout project as an isometric office floor with three workers, desks, and a small camera-grid project list.</desc>

  <rect width="1280" height="760" fill="#11101d"/>
  <rect x="24" y="24" width="1232" height="712" rx="14" fill="#181627" stroke="#43395b" stroke-width="3"/>
  <rect x="24" y="24" width="1232" height="54" rx="14" fill="#232035"/>
  <rect x="24" y="64" width="1232" height="14" fill="#232035"/>
  <circle cx="57" cy="51" r="8" fill="#ff757a"/>
  <circle cx="83" cy="51" r="8" fill="#ffcd71"/>
  <circle cx="109" cy="51" r="8" fill="#7edb97"/>
  <text x="145" y="58" fill="#f8e2b6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700" letter-spacing="2">THEY-WORK / OFFICE</text>
  <text x="1218" y="58" text-anchor="end" fill="#a49dbe" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">read-only preview</text>

  <text x="58" y="116" fill="#f8e2b6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700">OFFICE FLOOR</text>
  <text x="282" y="116" fill="#a49dbe" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">selected project: checkout</text>

  <!-- Selected project floor -->
  <rect x="58" y="142" width="812" height="496" fill="#232035" stroke="#6fCAFF" stroke-width="3"/>
  <rect x="58" y="142" width="812" height="52" fill="#312841"/>
  <text x="82" y="176" fill="#6fCAFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">• checkout</text>
  <text x="846" y="176" text-anchor="end" fill="#7edb97" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">3 workers • 2 busy</text>
  <text x="82" y="222" fill="#a49dbe" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">/home/dev/checkout</text>

  <!-- Isometric floor -->
  <polygon points="112,500 436,330 814,500 490,625" fill="#312841" stroke="#f8e2b6" stroke-width="3"/>
  <path d="M166 500 490 375 760 500M220 526 490 420 706 526M276 548 490 465 650 548M332 572 490 510 596 572" fill="none" stroke="#43395b" stroke-width="2"/>
  <path d="M274 415 598 585M382 358 706 528M490 334 814 500M166 500 490 625" fill="none" stroke="#43395b" stroke-width="2"/>

  <!-- Back wall and notice board -->
  <path d="M112 500V304l324-170 378 170v196L490 625Z" fill="#232035" stroke="#43395b" stroke-width="3"/>
  <path d="M112 304 436 134 814 304" fill="none" stroke="#f8e2b6" stroke-width="3"/>
  <polygon points="178,309 386,200 386,295 178,405" fill="#563a41" stroke="#a49dbe" stroke-width="2"/>
  <text x="210" y="302" fill="#f8e2b6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" transform="rotate(-27 210 302)">SHIP IT</text>
  <rect x="596" y="227" width="126" height="70" fill="#181627" stroke="#7edb97" stroke-width="3"/>
  <text x="659" y="255" text-anchor="middle" fill="#7edb97" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">STATUS</text>
  <text x="659" y="278" text-anchor="middle" fill="#f8e2b6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">shipping</text>

