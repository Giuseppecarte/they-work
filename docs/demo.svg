  <g transform="translate(278 424)">
    <polygon points="0,18 70,0 116,22 46,43" fill="#563a41" stroke="#f8e2b6" stroke-width="2"/>
    <path d="M12 26v54M103 31v48" stroke="#a49dbe" stroke-width="4"/>
    <rect x="43" y="14" width="26" height="18" fill="#11101d" stroke="#6fCAFF" stroke-width="2" transform="skewY(-18)"/>
