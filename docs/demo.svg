  <g transform="translate(468 486)">
    <polygon points="0,18 70,0 116,22 46,43" fill="#563a41" stroke="#f8e2b6" stroke-width="2"/>
    <path d="M12 26v54M103 31v48" stroke="#a49dbe" stroke-width="4"/>
    <rect x="43" y="14" width="26" height="18" fill="#11101d" stroke="#6fCAFF" stroke-width="2" transform="skewY(-18)"/>
    <g transform="translate(40 -48)">
      <rect x="12" y="0" width="18" height="18" fill="#f8e2b6"/>
      <rect x="8" y="18" width="26" height="25" fill="#7edb97"/>
      <rect x="3" y="43" width="36" height="8" fill="#563a41"/>
      <rect x="-2" y="51" width="46" height="7" fill="#11101d"/>
      <rect x="16" y="5" width="5" height="5" fill="#181627"/>
      <rect x="25" y="5" width="5" height="5" fill="#181627"/>
    </g>
    <text x="58" y="96" text-anchor="middle" fill="#a49dbe" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Dev 2 • CODEX</text>
  </g>

  <!-- Desk 3 -->
  <g transform="translate(650 409)">
    <polygon points="0,18 70,0 116,22 46,43" fill="#563a41" stroke="#f8e2b6" stroke-width="2"/>
    <path d="M12 26v54M103 31v48" stroke="#a49dbe" stroke-width="4"/>
    <rect x="43" y="14" width="26" height="18" fill="#11101d" stroke="#6fCAFF" stroke-width="2" transform="skewY(-18)"/>
    <g transform="translate(40 -48)">
