    <text x="58" y="96" text-anchor="middle" fill="#a49dbe" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">orchestrator • CLAUDE</text>
  </g>

  <!-- Camera grid preview -->
  <rect x="904" y="142" width="318" height="496" fill="#232035" stroke="#43395b" stroke-width="3"/>
  <text x="926" y="178" fill="#f8e2b6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">CAMERA GRID</text>
  <text x="1198" y="178" text-anchor="end" fill="#a49dbe" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">3 projects</text>
  <rect x="926" y="204" width="274" height="104" fill="#312841" stroke="#6fCAFF" stroke-width="3"/>
  <text x="944" y="232" fill="#6fCAFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700">• checkout</text>
  <text x="1180" y="232" text-anchor="end" fill="#7edb97" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">selected</text>
  <text x="944" y="258" fill="#a49dbe" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">3 workers • 2 busy</text>
  <rect x="926" y="324" width="274" height="104" fill="#312841" stroke="#7edb97" stroke-width="2"/>
  <text x="944" y="352" fill="#7edb97" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">• infra</text>
  <text x="944" y="378" fill="#a49dbe" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">1 worker • active</text>
  <rect x="926" y="444" width="274" height="104" fill="#312841" stroke="#d0a7ff" stroke-width="2"/>
  <text x="944" y="472" fill="#d0a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">• website</text>
  <text x="944" y="498" fill="#a49dbe" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">2 workers • active</text>

  <text x="58" y="687" fill="#a49dbe" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">Tab camera grid   Enter desk   p phone   ? help   q quit</text>
