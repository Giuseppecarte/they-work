      <rect x="8" y="18" width="26" height="25" fill="#d0a7ff"/>
      <rect x="3" y="43" width="36" height="8" fill="#563a41"/>
      <rect x="-2" y="51" width="46" height="7" fill="#11101d"/>
      <rect x="16" y="5" width="5" height="5" fill="#181627"/>
      <rect x="25" y="5" width="5" height="5" fill="#181627"/>
