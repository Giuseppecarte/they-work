[package]
name = "theywork-data-audit"
version = "0.0.0"
edition = "2021"
publish = false

# A standalone audit executable; intentionally not a product workspace member.
[workspace]

[dependencies]
anyhow = "1"
serde_json = "1"
ratatui = "0.29"
theywork-core = { path = "../../../../crates/theywork-core" }
theywork-control = { path = "../../../../crates/theywork-control" }
theywork-render = { path = "../../../../crates/theywork-render" }
theywork-collect = { path = "../../../../crates/theywork-collect" }
rusqlite = { version = "0.32", features = ["bundled"] }
