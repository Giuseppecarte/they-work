<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&display=swap">
  <style>
    body { margin: 0; background: #0d0b14; }
    a { color: #f0b429; } a:hover { color: #e8342c; }
    .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
    .px { font-family: "Press Start 2P", "JetBrains Mono", monospace; }
  </style>
</helmet>

<div style="width: 1200px; height: 760px; background: #0d0b14; position: relative; overflow: hidden; font-family: 'JetBrains Mono', ui-monospace, monospace;">

  <!-- terminal chrome -->
  <div style="display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 14px; background: #171425; border-bottom: 1px solid #2a2440;">
    <div style="display: flex; gap: 5px;">
      <div style="width: 9px; height: 9px; background: #e8342c;"></div>
      <div style="width: 9px; height: 9px; background: #f0b429;"></div>
      <div style="width: 9px; height: 9px; background: #56c26a;"></div>
    </div>
    <div style="color: #8a8299; font-size: 11px;">they-work &nbsp;&mdash;&nbsp; the floor</div>
    <div style="margin-left: auto; color: #4f9ee8; font-size: 11px;">5 workers &middot; 1 blocked</div>
  </div>

  <div style="display:flex;align-items:flex-end;gap:2px;height:32px;padding:0 12px;background:#12101a;border-bottom:1px solid #241f3d;"><div style="display:flex;align-items:center;gap:6px;height:26px;padding:0 12px;background:#241f3d;border:1px solid #3f3a55;border-bottom:none;font-size:10px;color:#e8e2d6;font-weight:700;"><span style="width:6px;height:6px;background:#f0b429;"></span>sustain<span style="color:#6f6885;font-weight:400;">5</span></div><div style="display:flex;align-items:center;gap:6px;height:26px;padding:0 12px;background:#171425;border:1px solid #241f3d;border-bottom:none;font-size:10px;color:#6f6885;font-weight:400;"><span style="width:6px;height:6px;background:#56c26a;"></span>hugo-ai<span style="color:#6f6885;font-weight:400;">5</span></div><div style="display:flex;align-items:center;gap:6px;height:26px;padding:0 12px;background:#171425;border:1px solid #241f3d;border-bottom:none;font-size:10px;color:#6f6885;font-weight:400;"><span style="width:6px;height:6px;background:#5c566e;"></span>giin-jalisco<span style="color:#6f6885;font-weight:400;">5</span></div><div style="display:flex;align-items:center;gap:6px;height:26px;padding:0 12px;background:#171425;border:1px solid #241f3d;border-bottom:none;font-size:10px;color:#6f6885;font-weight:400;"><span style="width:6px;height:6px;background:#56c26a;"></span>they-work<span style="color:#6f6885;font-weight:400;">5</span></div><div style="display:flex;align-items:center;gap:6px;height:26px;padding:0 12px;margin-left:8px;background:#171425;border:1px solid #241f3d;border-bottom:none;font-size:10px;color:#6f6885;"><svg width="9" height="9" viewBox="0 0 11 11" shape-rendering="crispEdges"><g fill="#6f6885"><rect x="0" y="0" width="4" height="4"/><rect x="7" y="0" width="4" height="4"/><rect x="0" y="7" width="4" height="4"/><rect x="7" y="7" width="4" height="4"/></g></svg>ALL</div></div>
  <!-- the scene -->
  <div style="position: relative; width: 1200px; height: 698px;">

    <svg width="1200" height="730" viewBox="0 0 1200 730" shape-rendering="crispEdges" style="position: absolute; inset: 0;">
      <defs>
        <g id="desk">
          <polygon points="-48,0 0,24 48,0 0,-24" fill="#8a5a38" stroke="#3d2413" stroke-width="1.5"/>
          <polygon points="-48,0 0,24 0,34 -48,10" fill="#6b4429" stroke="#3d2413" stroke-width="1.5"/>
          <polygon points="48,0 0,24 0,34 48,10" fill="#54331f" stroke="#3d2413" stroke-width="1.5"/>
          <polygon points="-26,-11 -2,1 -2,-25 -26,-37" fill="#241f33" stroke="#12101a" stroke-width="1.5"/>
          <polygon points="-23,-12 -5,-3 -5,-24 -23,-33" fill="#58d6e8"/>
          <polygon points="-23,-19 -5,-10 -5,-13 -23,-22" fill="#9df0fa" opacity="0.7"/>
          <polygon points="8,6 26,15 34,11 16,2" fill="#3a3358" stroke="#241f33" stroke-width="1.5"/>
        </g>
        <g id="plant">
          <polygon points="-8,0 0,4 8,0 0,-4" fill="#8a5a38" stroke="#3d2413"/>
          <polygon points="-8,0 0,4 0,14 -8,10" fill="#6b4429" stroke="#3d2413"/>
          <polygon points="8,0 0,4 0,14 8,10" fill="#54331f" stroke="#3d2413"/>
          <polygon points="0,-26 10,-8 0,-2 -10,-8" fill="#4fa860" stroke="#25553a" stroke-width="1.5"/>
          <polygon points="0,-18 14,-12 6,-4 -2,-8" fill="#3d8a4e" stroke="#25553a" stroke-width="1.5"/>
        </g>

      <polygon points="500,230 164,398 164,294 500,126" fill="#2b2542" stroke="#221d3a" stroke-width="2"/>

      <!-- windows: right wall -->

      <polygon points="600,280 664,312 664,252 600,220" fill="#5aa9c9"/>
      <polygon points="600,280 664,312 664,300 600,268" fill="#3d7d99"/>
      <polygon points="716,338 788,374 788,302 716,266" fill="#1b3a52" stroke="#121e2e" stroke-width="2"/>
      <polygon points="720,340 784,372 784,312 720,280" fill="#5aa9c9"/>
      <polygon points="720,340 784,372 784,360 720,328" fill="#3d7d99"/>

      <!-- signage on left wall -->

      <!-- floor plate -->
      <polygon points="500,230 884,422 548,590 164,398" fill="#dcc9a4" stroke="#8a7350" stroke-width="2"/>
      <polygon points="500,230 884,422 548,590 164,398" fill="none" stroke="#c0aa82" stroke-width="1"/>
      <g stroke="#c8b28c" stroke-width="1">

      <!-- ===== back row of desks (drawn far to near) ===== -->

        <polygon points="500,254 512,260 512,278 500,272" fill="#e8834a" stroke="#7a3d1c" stroke-width="1.5"/>

      <rect x="466" y="322" width="68" height="4" fill="#2a2440"/>
      <rect x="466" y="322" width="58" height="4" fill="#56c26a"/>

      <!-- D2 Dev 1, Codex -->
      <use href="#desk" x="596" y="326"/>
      <g>
        <polygon points="596,302 608,308 608,326 596,320" fill="#4f9ee8" stroke="#1f4f7d" stroke-width="1.5"/>
        <polygon points="596,302 584,308 584,326 596,320" fill="#3a7cbd" stroke="#1f4f7d" stroke-width="1.5"/>
        <rect x="588" y="282" width="16" height="14" fill="#f2c9a0" stroke="#8a5a38" stroke-width="1.5"/>
        <rect x="587" y="278" width="18" height="7" fill="#5a3a22"/>
        <rect x="592" y="288" width="3" height="3" fill="#2e2118"/>
        <rect x="599" y="288" width="3" height="3" fill="#2e2118"/>
      </g>
      <text x="596" y="364" text-anchor="middle" fill="#12101a" font-size="10" font-family="JetBrains Mono, monospace" font-weight="700">Dev 1</text>
      <rect x="562" y="370" width="68" height="4" fill="#2a2440"/>
      <rect x="562" y="370" width="30" height="4" fill="#56c26a"/>

      <g>
        <polygon points="692,350 704,356 704,374 692,368" fill="#4f9ee8" stroke="#1f4f7d" stroke-width="1.5"/>
        <polygon points="692,350 680,356 680,374 692,368" fill="#3a7cbd" stroke="#1f4f7d" stroke-width="1.5"/>
        <rect x="684" y="330" width="16" height="14" fill="#f2c9a0" stroke="#8a5a38" stroke-width="1.5"/>
        <rect x="683" y="326" width="18" height="7" fill="#2e2118"/>
        <rect x="688" y="336" width="3" height="3" fill="#2e2118"/>
        <rect x="695" y="336" width="3" height="3" fill="#2e2118"/>
        <rect x="704" y="330" width="5" height="14" fill="#f2c9a0" stroke="#8a5a38" stroke-width="1.5"/>
      </g>
      <!-- blocked marker -->
      <polygon points="692,286 712,300 692,314 672,300" fill="#f0b429" stroke="#8a5f05" stroke-width="2"/>
      <rect x="690" y="292" width="4" height="10" fill="#12101a"/>
      <rect x="690" y="305" width="4" height="4" fill="#12101a"/>
      <text x="692" y="412" text-anchor="middle" fill="#12101a" font-size="10" font-family="JetBrains Mono, monospace" font-weight="700">Dev 2</text>
      <rect x="658" y="418" width="68" height="4" fill="#2a2440"/>
      <rect x="658" y="418" width="44" height="4" fill="#f0b429"/>

      <!-- D4 Dev 3, Codex -->
      <use href="#desk" x="404" y="374"/>
      <g>
        <polygon points="404,350 416,356 416,374 404,368" fill="#4f9ee8" stroke="#1f4f7d" stroke-width="1.5"/>
        <polygon points="404,350 392,356 392,374 404,368" fill="#3a7cbd" stroke="#1f4f7d" stroke-width="1.5"/>
        <rect x="396" y="330" width="16" height="14" fill="#f2c9a0" stroke="#8a5a38" stroke-width="1.5"/>
        <rect x="395" y="326" width="18" height="7" fill="#8a5a2c"/>

        <rect x="407" y="336" width="3" height="3" fill="#2e2118"/>
      </g>
      <text x="404" y="412" text-anchor="middle" fill="#12101a" font-size="10" font-family="JetBrains Mono, monospace" font-weight="700">Dev 3</text>
      <rect x="370" y="418" width="68" height="4" fill="#2a2440"/>
      <rect x="370" y="418" width="16" height="4" fill="#8a8299"/>

      <!-- D5 Collector, Claude -->
      <use href="#desk" x="500" y="422"/>
      <g>
        <polygon points="500,398 512,404 512,422 500,416" fill="#e8834a" stroke="#7a3d1c" stroke-width="1.5"/>
        <polygon points="500,398 488,404 488,422 500,416" fill="#c96a37" stroke="#7a3d1c" stroke-width="1.5"/>
        <rect x="492" y="378" width="16" height="14" fill="#f2c9a0" stroke="#8a5a38" stroke-width="1.5"/>
        <rect x="491" y="374" width="18" height="7" fill="#3f2d55"/>
        <rect x="496" y="384" width="3" height="3" fill="#2e2118"/>
        <rect x="503" y="384" width="3" height="3" fill="#2e2118"/>
      </g>
      <text x="500" y="460" text-anchor="middle" fill="#12101a" font-size="10" font-family="JetBrains Mono, monospace" font-weight="700">Collector</text>
      <rect x="466" y="466" width="68" height="4" fill="#2a2440"/>
      <rect x="466" y="466" width="52" height="4" fill="#56c26a"/>

      <!-- the manager, walking toward the blocked desk -->
      <g>
        <polygon points="626,432 636,437 636,453 626,448" fill="#c9c2d6" stroke="#5c566e" stroke-width="1.5"/>
        <polygon points="626,432 616,437 616,453 626,448" fill="#a8a1ba" stroke="#5c566e" stroke-width="1.5"/>
        <rect x="619" y="414" width="14" height="13" fill="#f2c9a0" stroke="#8a5a38" stroke-width="1.5"/>
        <rect x="618" y="410" width="16" height="6" fill="#2e2118"/>
        <rect x="622" y="419" width="3" height="3" fill="#2e2118"/>
        <rect x="628" y="419" width="3" height="3" fill="#2e2118"/>
      </g>
      <text x="626" y="472" text-anchor="middle" fill="#12101a" font-size="9" font-family="JetBrains Mono, monospace">manager</text>

      <!-- props -->
      <use href="#plant" x="236" y="362"/>
      <use href="#plant" x="812" y="410"/>
      <g>
        <polygon points="332,470 356,482 380,470 356,458" fill="#3a3358" stroke="#221d3a" stroke-width="1.5"/>
        <polygon points="332,470 356,482 356,492 332,480" fill="#2b2542" stroke="#221d3a" stroke-width="1.5"/>
        <polygon points="380,470 356,482 356,492 380,480" fill="#221d3a" stroke="#221d3a" stroke-width="1.5"/>
      </g>
      <text x="356" y="506" text-anchor="middle" fill="#6f6047" font-size="8" font-family="JetBrains Mono, monospace">meeting table</text>
    </svg>

    <!-- the project title, extruded, lying along the isometric axis -->
    <div style="position: absolute; left: 232px; top: 96px; transform: rotate(26.57deg);">
      <div class="px" style="font-size: 58px; color: #e8342c; letter-spacing: 2px; line-height: 1; text-shadow: 2px 2px 0 #8e1a15, 4px 4px 0 #8e1a15, 6px 6px 0 #8e1a15, 8px 8px 0 #8e1a15, 10px 10px 0 #8e1a15, 12px 12px 0 #5c0f0c, 14px 14px 0 #5c0f0c;">SUSTAIN</div>
    </div>

    <!-- status bar -->
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 34px; display: flex; align-items: center; gap: 18px; padding: 0 16px; background: #171425; border-top: 1px solid #2a2440; font-size: 11px; color: #8a8299;">
      <span><span style="color: #56c26a;">&#9632;</span> 3 running</span>
      <span><span style="color: #8a8299;">&#9632;</span> 1 idle</span>
      <span><span style="color: #f0b429;">&#9632;</span> 1 blocked</span>
      <span style="margin-left: auto; color: #5c566e;">Tab cameras &nbsp; Enter desk &nbsp; p phone &nbsp; ? help &nbsp; q quit</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
